<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагування напою</title>
    <link rel="stylesheet" th:href="@{/css/styles.css(v=1)}">
</head>
<body>
<h2>Редагувати напій</h2>
<form th:action="@{/drinks/update/{id}(id=${drinkToEdit.id})}" th:object="${drinkToEdit}" method="post">
    <div>
        <label>Назва:</label>
        <input type="text" th:field="*{name}" required>
    </div>

    <div>
        <label>Категорія:</label>
        <select th:field="*{categoryId}">
            <option value="">-- Оберіть категорію --</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>
    </div>

    <div class="checkbox-group-container">
        <label>Інгредієнти:</label>
        <div class="checkbox-group">
                <span th:each="ing : ${ingredients}">
                    <input type="checkbox" th:field="*{ingredientIds}" th:value="${ing.id}">
                    <label th:text="${ing.name}"></label>
                </span>
        </div>
    </div>

    <div>
        <label>Об'єм (л):</label>
        <input type="number" step="0.01" th:field="*{volume}" required>
    </div>

    <div>
        <label>Ціна (грн):</label>
        <input type="number" step="0.01" th:field="*{price}" required>
    </div>

    <button type="submit">Зберегти зміни</button>
</form>

<br>
<a th:href="@{/drinks}">Повернутися до списку</a>
</body>
</html>
