<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Облік напоїв з інгредієнтами</title>
    <!-- Додано параметр ?v=1 щоб обійти кешування браузера під час розробки -->
    <link rel="stylesheet" th:href="@{/css/styles.css(v=1)}">
</head>
<body>
<h2>Список напоїв</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Назва</th>
        <th>Категорія</th>
        <th>Інгредієнти</th>
        <th>Об'єм (л)</th>
        <th>Ціна (грн)</th>
        <th>Дії</th>
    </tr>
    <tr th:each="drink : ${drinks}">
        <td th:text="${drink.id}"></td>
        <td th:text="${drink.name}"></td>
        <td th:text="${drink.categoryName != null ? drink.categoryName : 'Немає'}"></td>
        <td th:text="${drink.ingredientNames != null and !drink.ingredientNames.isEmpty() ? #strings.listJoin(drink.ingredientNames, ', ') : 'Немає'}"></td>
        <td th:text="${drink.volume}"></td>
        <td th:text="${drink.price}"></td>
        <td>
            <a th:href="@{/drinks/edit/{id}(id=${drink.id})}">Редагувати</a> |
            <a th:href="@{/drinks/delete/{id}(id=${drink.id})}">Видалити</a>
        </td>
    </tr>
</table>

<hr>

<h2>Додати новий напій</h2>
<form th:action="@{/drinks/add}" th:object="${newDrink}" method="post">
    <div>
        <label>Назва:</label>
        <input type="text" th:field="*{name}" required>
    </div>

    <div>
        <label>Категорія:</label>
        <select th:field="*{categoryId}">
            <option value="">-- Оберіть категорію --</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>
    </div>

    <div class="checkbox-group-container">
        <label>Інгредієнти:</label>
        <div class="checkbox-group">
                <span th:each="ing : ${ingredients}">
                    <input type="checkbox" th:field="*{ingredientIds}" th:value="${ing.id}">
                    <label th:text="${ing.name}"></label>
                </span>
        </div>
    </div>

    <div>
        <label>Об'єм (л):</label>
        <input type="number" step="0.01" th:field="*{volume}" required>
    </div>

    <div>
        <label>Ціна (грн):</label>
        <input type="number" step="0.01" th:field="*{price}" required>
    </div>

    <button type="submit">Додати напій</button>
</form>
</body>
</html>
